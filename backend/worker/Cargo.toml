[package]
name = "akr-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "akr_worker"
path = "src/lib.rs"

[[bin]]
name = "akr-worker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
akr-audit.workspace = true
akr-common.workspace = true
akr-crypto.workspace = true
akr-db.workspace = true
akr-domain.workspace = true
akr-jobs.workspace = true
akr-objectstore.workspace = true
akr-telemetry.workspace = true
async-trait.workspace = true
chrono.workspace = true
metrics.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true
