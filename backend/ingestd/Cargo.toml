[package]
name = "akr-ingestd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "akr_ingestd"
path = "src/lib.rs"

[[bin]]
name = "akr-ingestd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
akr-common.workspace = true
akr-db.workspace = true
akr-domain.workspace = true
akr-telemetry.workspace = true
async-trait.workspace = true
sqlx = { workspace = true, features = ["postgres"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
