# pgBackRest, profile S. The repository is the backuprepo volume, which the install points at the backup
# server; a second, offsite repository is declared at install (repo2-*). Everything written to a
# repository is encrypted first. The passphrase is not in this file: the schedule script and the
# archive command take it from the environment (PGBACKREST_REPO1_CIPHER_PASS).
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
start-fast=y
compress-type=zst
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest
spool-path=/var/spool/pgbackrest

[akr]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
