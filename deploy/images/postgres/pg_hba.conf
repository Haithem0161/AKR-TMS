# TYPE   DATABASE  USER  ADDRESS  METHOD
# The socket inside the container: health checks and the image's first-run scripts.
local    all       all            peer
# Every network connection is TLS with SCRAM (SP-08). There is no plain `host` line, so a client that
# does not negotiate TLS is refused.
hostssl  all       all   all      scram-sha-256
hostssl  replication all all      scram-sha-256
