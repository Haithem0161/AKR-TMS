# Prometheus, profile S. It scrapes the management listener of every AKR binary; the edge never routes
# that listener.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: akr-api
    static_configs: [{ targets: ["akr-api:9101"] }]
  - job_name: akr-worker
    static_configs: [{ targets: ["akr-worker:9101"] }]
  - job_name: akr-ingestd
    static_configs: [{ targets: ["akr-ingestd:9101"] }]
  - job_name: akr-assess
    static_configs: [{ targets: ["akr-assess:9101"] }]
  - job_name: akr-s3guard
    static_configs: [{ targets: ["s3guard:9101"] }]
