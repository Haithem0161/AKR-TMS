# Alertmanager, profile S. The install replaces the `operator` receiver with the bank's paging channel
# (webhook or mail relay); as shipped, alerts are held and shown, and sent nowhere.
route:
  receiver: operator
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operator
